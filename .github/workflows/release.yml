name: Build WooCommerce plugin release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l forus-woocommerce.php
      - name: Build installable plugin ZIP
        run: |
          mkdir -p build/forus-woocommerce
          cp forus-woocommerce.php README.md build/forus-woocommerce/
          cd build
          zip -r "../forus-woocommerce-${GITHUB_REF_NAME}.zip" forus-woocommerce
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: forus-woocommerce-${{ github.ref_name }}
          path: forus-woocommerce-${{ github.ref_name }}.zip
      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: forus-woocommerce-${{ github.ref_name }}.zip
          generate_release_notes: true

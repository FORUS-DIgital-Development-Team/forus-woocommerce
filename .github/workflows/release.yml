name: Validate WooCommerce candidate
on:
  push:
    branches: [master, feature/woocommerce-v1.1-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check Blocks JavaScript syntax
        run: node --check includes/blocks.js
      - name: Security and gateway behavior
        run: |
          php tests/security.php
          php tests/gateway.php
          php tests/gateway.php --release-gate
  package:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development artifact only
        run: |
          mkdir -p build/forus-woocommerce
          cp forus-woocommerce.php README.md build/forus-woocommerce/
          cp -r includes build/forus-woocommerce/
          cd build
          zip -r ../forus-woocommerce-1.1.0-dev.zip forus-woocommerce
      - uses: actions/upload-artifact@v4
        with:
          name: forus-woocommerce-1.1.0-dev
          path: forus-woocommerce-1.1.0-dev.zip
          retention-days: 14

